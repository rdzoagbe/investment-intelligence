services:
  - type: web
    name: investment-intelligence
    runtime: python
    plan: starter
    buildCommand: "python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && rm -rf backend/static && cp -R frontend/dist backend/static"
    startCommand: "python backend/run.py"
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_DB_PATH
        value: /var/data/investment.db
      - key: MARKET_DATA_MODE
        value: live
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: investment-data
      mountPath: /var/data
      sizeGB: 1
