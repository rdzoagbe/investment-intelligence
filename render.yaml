services:
  - type: web
    name: investment-intelligence
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "python -m pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build && cd .. && rm -rf backend/static && cp -R frontend/dist backend/static"
    startCommand: "python backend/run.py"
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: investment-intelligence-db
          property: connectionString
      - key: MARKET_DATA_MODE
        value: live
      - key: CORS_ORIGINS
        value: "*"
      # SEC EDGAR fundamentals: set to "Your Name your@email" in the Render dashboard.
      # The SEC asks automated clients to identify themselves; without it the SEC adapter stays off.
      - key: SEC_USER_AGENT
        sync: false
      # Optional: enables generated answers in the research assistant (Claude). Without it,
      # the assistant lists the evidence it found. OPENAI_API_KEY also works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shared secret for /api/jobs/daily-scan (the daily-scan GitHub workflow sends it).
      - key: JOB_TOKEN
        generateValue: true
      # Optional: ceiling on assistant questions across ALL users per day (in-process counter).
      - key: ASSISTANT_GLOBAL_DAILY_LIMIT
        value: "500"
      # Optional: Tiingo API key for US stock quotes and daily history (licensed API).
      # The FREE Tiingo plan is for personal use only (data may not be shown to other people),
      # so the key is only used when OWNER_USER_IDS is set (private site: only those accounts
      # see data, sign-up closed) or TIINGO_LICENSE=commercial (your plan allows redistribution).
      - key: TIINGO_API_KEY
        sync: false
      # Comma-separated account ids (Settings > My data shows yours). Empty = public site.
      - key: OWNER_USER_IDS
        sync: false

databases:
  # WARNING: Render's FREE PostgreSQL plan EXPIRES about 30 days after creation. After a
  # short grace period the database is DELETED, together with every account, holding,
  # journal entry, paper order, alert and track-record snapshot. Before relying on this
  # deployment, upgrade to a paid plan (for example `plan: basic-256mb`) or plan to export
  # data (users: Settings > Export my data; operator: pg_dump) and re-create the database.
  # /api/health returns 503 and /api/status reports "database": {"ok": false} when the
  # database is unreachable, so Render's health check shows the outage.
  - name: investment-intelligence-db
    plan: free
    region: frankfurt
    databaseName: investment_intelligence
    user: investment_intelligence
