services:
  - type: web
    name: investment-intelligence
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "python -m pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && rm -rf backend/static && cp -R frontend/dist backend/static"
    startCommand: "python backend/run.py"
    healthCheckPath: /api/health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: investment-intelligence-db
          property: connectionString
      - key: MARKET_DATA_MODE
        value: live
      - key: CORS_ORIGINS
        value: "*"
      # SEC EDGAR fundamentals: set to "Your Name your@email" in the Render dashboard.
      # The SEC asks automated clients to identify themselves; without it the SEC adapter stays off.
      - key: SEC_USER_AGENT
        sync: false
      # Optional: enables generated answers in the research assistant (Claude). Without it,
      # the assistant lists the evidence it found. OPENAI_API_KEY also works.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shared secret for /api/jobs/daily-scan (the daily-scan GitHub workflow sends it).
      - key: JOB_TOKEN
        generateValue: true

databases:
  - name: investment-intelligence-db
    plan: free
    region: frankfurt
    databaseName: investment_intelligence
    user: investment_intelligence
